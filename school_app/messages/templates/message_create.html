{% extends 'messages_page.html' %}
{% load i18n %}

{% block title %}{% translate "New message" %}{% endblock %}

{% block message %}
<div class="card-header bg-success text-white">
    <h5 class="mb-0">
        <i class="fas fa-calendar-alt me-2"></i>
        {% translate "Add a New Message" %}
    </h5>
</div>
<div class="card-body flex-grow-1 overflow-auto p-2">                                            
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary btn-lg">{% translate "Save" %}</button>
    </form>
</div>
     
</div>
{% endblock %}
