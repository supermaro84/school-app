{% extends 'announcements_page.html' %}
{% load i18n %}

{% block title %}{% translate "Edit Announcement" %}{% endblock %}

{% block announcement %}
<div class="card-header bg-success text-white">
    <h5 class="mb-0">
        <i class="fas fa-calendar-alt me-2"></i>
        {% translate "Edit Announcement" %}
    </h5>
</div>
<div class="card-body flex-grow-1 overflow-auto p-2">                                            
    <form method="post">
       {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">{% translate "Title" %}</label>
            {{ form.title }}
        </div>
        
        <div class="mb-3">
            <label class="form-label">{% translate "Text" %}</label>
            {{ form.text }}
        </div>
         <div class="mb-3">
            <label class="form-label">{% translate "Groups" %}</label>
            <select name="groups" class="group-select" multiple>
                {% for gp in form.groups.field.queryset %}
                    <option value="{{ gp.pk }}"
                        {% if form.instance.pk and gp in form.instance.groups.all %}selected{% endif %}>
                        {{ gp.group.name }}
                    </option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">{% translate "Users" %}</label>
            <select class="users-select" name="users" multiple>
                {% for user_profile in form.users.field.queryset %}
                    <option value="{{ user_profile.pk }}"
                        {% if user_profile in form.instance.users.all %}selected{% endif %}>
                        {{ user_profile.username }}
                    </option>
                {% endfor %}
            </select>
        </div>
        
        <div class="mb-3">
            <label class="form-label">{% translate "Expiration Date" %}</label>
            {{ form.exp_date }}
        </div>
        <button type="submit" class="btn btn-primary btn-lg">{% translate "Save" %}</button>
    </form>
</div>
     
    </form>
        {{ form.media }}
    <script>
        new SlimSelect({ settings: slimSelectSettings,
            select: '.group-select'
        });
        new SlimSelect({ settings: slimSelectSettings,
            select: '.users-select'
        });
    </script>
</div>
{% endblock %}
