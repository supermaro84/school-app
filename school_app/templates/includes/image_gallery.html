{% load i18n %}
{% if images %}
<div class="row row-cols-3 row-cols-sm-4 g-2 my-2">
    {% for image in images %}
    <div class="col">
        <a href="{{ image.file.url }}" target="_blank" rel="noopener" title="{% translate 'Open full size' %}">
            <img src="{{ image.file.url }}" class="img-thumbnail thumb p-0" alt="" loading="lazy">
        </a>
    </div>
    {% endfor %}
</div>
{% endif %}
