{% load i18n %}
{# Adds a show/hide button inside every password field on the page #}
<script>
document.addEventListener('DOMContentLoaded', function () {
    var labels = {
        show: '{% filter escapejs %}{% translate "Show password" %}{% endfilter %}',
        hide: '{% filter escapejs %}{% translate "Hide password" %}{% endfilter %}'
    };
    document.querySelectorAll('input[type="password"]').forEach(function (input) {
        var wrapper = document.createElement('div');
        wrapper.className = 'password-field';
        // Bootstrap shows .invalid-feedback after an .is-invalid sibling
        if (input.classList.contains('is-invalid')) { wrapper.classList.add('is-invalid'); }
        input.parentNode.insertBefore(wrapper, input);
        wrapper.appendChild(input);

        var button = document.createElement('button');
        button.type = 'button';
        button.className = 'password-toggle';
        button.setAttribute('data-password-toggle', '');
        button.setAttribute('aria-label', labels.show);
        button.title = labels.show;
        button.innerHTML = '<i class="bi bi-eye" aria-hidden="true"></i>';
        button.addEventListener('click', function () {
            var showing = input.type === 'text';
            input.type = showing ? 'password' : 'text';
            var label = showing ? labels.show : labels.hide;
            button.setAttribute('aria-label', label);
            button.title = label;
            button.setAttribute('aria-pressed', showing ? 'false' : 'true');
            button.firstChild.className = 'bi ' + (showing ? 'bi-eye' : 'bi-eye-slash');
            input.focus();
        });
        wrapper.appendChild(button);
    });
});
</script>
