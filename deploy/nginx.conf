# nginx site: serves static files and uploads, passes the rest to gunicorn.
# HTTP only (no domain yet). Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/school-app
#   sudo ln -s /etc/nginx/sites-available/school-app /etc/nginx/sites-enabled/

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Largest request: a post may carry 10 documents of up to 20 MB plus
    # 10 images (media/forms.py). Bodies over 16k are buffered to disk.
    client_max_body_size 250M;

    location /static/ {
        alias /srv/school-app/school_app/staticfiles/;
        expires 7d;
    }

    location /uploads/ {
        alias /srv/school-app/school_app/uploads/;
    }

    location / {
        proxy_pass http://unix:/run/school-app/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
